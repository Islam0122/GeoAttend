# GeoAttend: serves the PWA and reverse-proxies the API.
# Browser geolocation requires HTTPS in production: terminate TLS here (see deploy/nginx/tls.conf.example) or at your load balancer.
upstream geoattend_api { server api:8000; keepalive 16; }

limit_req_zone $binary_remote_addr zone=api_ip:10m rate=30r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 1m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location /api/ {
    limit_req zone=api_ip burst=60 nodelay;
    proxy_pass http://geoattend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
  }
  location = /healthz { proxy_pass http://geoattend_api; }

  # Cache control via `expires` (NOT add_header): a location-level add_header would drop the
  # server-level security headers above (nginx inheritance rule).
  # Never cache the service worker, manifest or HTML shell (so updates roll out); hashed assets are immutable.
  location = /sw.js { expires -1; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; expires -1; try_files $uri =404; }
  location /assets/ { expires 1y; try_files $uri =404; }

  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
