# GeoAttend stack: PostGIS, Redis, FastAPI API, Celery worker + beat, Nginx (PWA + reverse proxy).
#   cp .env.example .env      # set POSTGRES_PASSWORD and GEOATTEND_SECRET_KEY at minimum
#   docker compose up -d --build
name: geoattend

x-backend: &backend
  build: ./backend
  image: geoattend-api:latest
  env_file: .env
  environment:
    GEOATTEND_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geoattend}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-geoattend}
    GEOATTEND_REDIS_URL: redis://redis:6379/2
    GEOATTEND_CELERY_BROKER_URL: redis://redis:6379/0
    GEOATTEND_CELERY_RESULT_BACKEND: redis://redis:6379/1
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geoattend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-geoattend}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: ["api"]
    expose: ["8000"]

  worker:
    <<: *backend
    command: ["worker"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 5
    depends_on:
      api: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["beat"]
    healthcheck: { disable: true }
    volumes: [beatdata:/app/run]
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_MAP_TILES: ${VITE_MAP_TILES:-}
    image: geoattend-web:latest
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  beatdata:
